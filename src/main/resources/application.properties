# JWT Values
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# 1h in milliseconds
security.jwt.expiration-time=3600000

# AWS Cognito Configuration
aws.cognito.user-pool-id=your-user-pool-id
aws.cognito.client-id=your-app-client-id
aws.cognito.client-secret=your-app-client-secret
aws.region=your-aws-region

# OAuth2 Configuration for Google Sign-In
spring.security.oauth2.client.registration.google.client-id=1066729253399-d97h2cdr44us8u4lt68fiunlisbl8gdr.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=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
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:9494/auth/google-callback
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# Custom redirect URI for Google OAuth2 callback
google.redirect-uri=http://localhost:9494/auth/google-callback

# Facebook Client Configuration
spring.security.oauth2.client.registration.facebook.client-id=2786714318198240
spring.security.oauth2.client.registration.facebook.client-secret=1def7f30ed985ec748c50ddb022495df
spring.security.oauth2.client.registration.facebook.redirect-uri=http://localhost:9494/auth/facebook-callback
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.facebook.client-name=Facebook

# Facebook Provider Configuration
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v12.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v12.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email
spring.security.oauth2.client.provider.facebook.user-name-attribute=id



